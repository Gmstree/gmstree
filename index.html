<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contribution Skyline</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--color-background)',
            foreground: 'var(--color-foreground)',
            muted: 'var(--color-muted)',
            'muted-foreground': 'var(--color-muted-foreground)',
            border: 'var(--color-border)',
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --color-background: #ffffff;
      --color-foreground: #171717;
      --color-muted: #f4f4f5;
      --color-muted-foreground: #737373;
      --color-border: #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background: #0d1117;
        --color-foreground: #f0f6fc;
        --color-muted: #161b22;
        --color-muted-foreground: #8b949e;
        --color-border: #30363d;
      }
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--color-background);
      color: var(--color-foreground);
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-background text-foreground min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useLayoutEffect } = React;

    // #region Pure Maths & Logic
    const DAY_MS = 86400000;
    const clamp01 = (v) => (v > 0 ? (v < 1 ? v : 1) : 0);
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeInOutCubic = (x) => {
      const t = clamp01(x);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };
    const easeOutCubic = (x) => 1 - Math.pow(1 - clamp01(x), 3);
    const smoothstep = (a, b, x) => {
      const t = clamp01((x - a) / (b - a));
      return t * t * (3 - 2 * t);
    };

    const toKey = (ms) => new Date(ms).toISOString().slice(0, 10);
    const dayMs = (v) => {
      if (typeof v === "number") return Math.floor(v / DAY_MS) * DAY_MS;
      if (typeof v === "string") {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v);
        if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
        v = new Date(v);
      }
      return Date.UTC(v.getFullYear(), v.getMonth(), v.getDate());
    };

    const rng = (seed) => {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    };

    const generateContributions = (endMs, seed = 7, days = 371) => {
      const r = rng(seed);
      const bursts = Array.from({ length: 4 }, () => ({ at: r(), width: 0.035 + r() * 0.07, gain: 0.6 + r() * 1.1 }));
      const out = [];
      let mood = 0.5;
      for (let i = 0; i < days; i++) {
        const ms = endMs - (days - 1 - i) * DAY_MS;
        const x = i / Math.max(1, days - 1);
        const dow = new Date(ms).getUTCDay();
        const weekend = dow === 0 || dow === 6;
        let heat = 0.2;
        for (const b of bursts) heat += b.gain * Math.exp(-((x - b.at) ** 2) / (2 * b.width ** 2));
        mood = mood * 0.85 + r() * 0.15;
        heat *= 0.55 + mood * 0.9;
        const pActive = Math.min(0.94, (weekend ? 0.22 : 0.5) + heat * 0.4);
        let count = 0;
        if (r() < pActive) count = 1 + Math.floor(-Math.log(1 - r()) * (1.2 + heat * 7) * (weekend ? 0.5 : 1));
        if (r() < 0.01) count += 18 + Math.floor(r() * 24);
        out.push({ date: toKey(ms), count });
      }
      return out;
    };

    const buildGrid = (data, endMs, weekStart = 0) => {
      const counts = new Map();
      for (const d of data) {
        if (!d || typeof d.date !== "string") continue;
        const ms = dayMs(d.date);
        const c = Number(d.count);
        if (!Number.isFinite(ms) || !(c > 0) || !Number.isFinite(c)) continue;
        const k = toKey(ms);
        counts.set(k, (counts.get(k) ?? 0) + c);
      }
      let start = endMs - 364 * DAY_MS;
      start -= ((new Date(start).getUTCDay() - weekStart + 7) % 7) * DAY_MS;
      const cells = [];
      for (let ms = start, i = 0; ms <= endMs; ms += DAY_MS, i++) {
        const date = toKey(ms);
        cells.push({ date, count: counts.get(date) ?? 0, level: 0, week: Math.floor(i / 7), day: i % 7 });
      }
      const nz = cells.map((c) => c.count).filter((c) => c > 0).sort((a, b) => a - b);
      const busy = nz.length ? nz[Math.floor(0.95 * (nz.length - 1))] : 0;
      for (const c of cells) c.level = levelOf(c.count, busy);
      return { cells, weeks: cells.length ? cells[cells.length - 1].week + 1 : 0, max: nz.length ? nz[nz.length - 1] : 0 };
    };

    const levelOf = (count, busy) => (count <= 0 ? 0 : busy <= 0 ? 4 : 1 + Math.min(3, Math.floor((count / busy) * 4)));

    const computeStats = (cells) => {
      let total = 0, best = 0, bestDate = null, run = 0, runStart = null;
      let longest = { days: 0, start: null, end: null };
      for (const c of cells) {
        total += c.count;
        if (c.count > best) { best = c.count; bestDate = c.date; }
        if (c.count > 0) {
          if (run === 0) runStart = c.date;
          run++;
          if (run > longest.days) longest = { days: run, start: runStart, end: c.date };
        } else run = 0;
      }
      let j = cells.length - 1;
      while (j >= 0 && cells[j].count === 0) j--;
      const endAt = j;
      while (j >= 0 && cells[j].count > 0) j--;
      const days = endAt - j;
      const current = days > 0 ? { days, start: cells[j + 1].date, end: cells[endAt].date } : { days: 0, start: null, end: null };
      return { total, first: cells.length ? cells[0].date : null, last: cells.length ? cells[cells.length - 1].date : null, busiest: { count: best, date: bestDate }, longest, current };
    };

    const monthLabels = (cells, weeks, locale = "en-US") => {
      const fmt = new Intl.DateTimeFormat(locale, { month: "short", timeZone: "UTC" });
      const out = [];
      let prev = -1;
      for (let w = 0; w < weeks; w++) {
        const c = cells[w * 7];
        if (!c) break;
        const m = +c.date.slice(5, 7);
        if (m !== prev) out.push({ week: w, label: fmt.format(dayMs(c.date)) });
        prev = m;
      }
      if (out.length > 1 && out[1].week - out[0].week < 3) out.shift();
      return out;
    };

    const barHeight = (count, max, scale = 1) => (count > 0 && max > 0 ? 0.4 + Math.pow(count / max, 0.85) * 7.2 * scale : 0.2);
    const WAVE = 0.42;
    const riseAt = (t, week, weeks, day) => {
      const d = (weeks > 1 ? week / (weeks - 1) : 0) * 0.36 + (day / 6) * 0.06;
      return easeOutCubic((t - d) / (1 - WAVE));
    };

    const YAW_3D = Math.PI / 4;
    const ELEV_3D = (34 * Math.PI) / 180;
    const YAW_RANGE = [(8 * Math.PI) / 180, (82 * Math.PI) / 180];
    const ELEV_RANGE = [(18 * Math.PI) / 180, (62 * Math.PI) / 180];

    const camera = (e, dYaw = 0, dElev = 0) => {
      const yaw = Math.min(YAW_RANGE[1], Math.max(0, lerp(0, YAW_3D + dYaw, e)));
      const elev = lerp(Math.PI / 2, Math.min(ELEV_RANGE[1], Math.max(ELEV_RANGE[0], ELEV_3D + dElev)), e);
      return { cs: Math.cos(yaw), sn: Math.sin(yaw), se: Math.sin(elev), ce: Math.cos(elev) };
    };

    const project = (c, x, y, z) => [x * c.cs - y * c.sn, (x * c.sn + y * c.cs) * c.se - z * c.ce];
    const mixRGB = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    const luminance = (c) => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;

    const PALETTES = {
      github: { light: ["#c6e48b", "#7bc96f", "#239a3b", "#196127"], dark: ["#0e4429", "#006d32", "#26a641", "#39d353"] },
      halloween: { light: ["#ffee4a", "#ffc501", "#fe9600", "#b33c00"], dark: ["#631c03", "#bd561d", "#fa7a18", "#fddf68"] },
      ocean: { light: ["#b8e3f5", "#6ec3eb", "#2a8fd1", "#0b4f8a"], dark: ["#0c2d4a", "#12508a", "#2a88d8", "#7cc7ff"] },
      ember: { light: ["#fde2c4", "#fbad6e", "#f06b3a", "#b3261e"], dark: ["#4a1a10", "#8f2f16", "#e0572a", "#ffa46b"] },
      grape: { light: ["#e4d4fb", "#b794f4", "#805ad5", "#44337a"], dark: ["#2d1f4f", "#553c9a", "#8b5cf6", "#c4b5fd"] },
      mono: { light: ["#d4d4d4", "#a3a3a3", "#525252", "#171717"], dark: ["#333333", "#5c5c5c", "#a3a3a3", "#fafafa"] },
    };

    const resolvePalette = (p, dark) => {
      const pick = Array.isArray(p) ? p : typeof p === "object" && p ? (dark ? p.dark : p.light) : PALETTES[p ?? "github"] ? PALETTES[p ?? "github"][dark ? "dark" : "light"] : PALETTES.github[dark ? "dark" : "light"];
      const base = PALETTES.github[dark ? "dark" : "light"];
      return [0, 1, 2, 3].map((i) => pick[i] ?? pick[pick.length - 1] ?? base[i]);
    };

    const FG_FALLBACK = [23, 23, 23];
    const BG_FALLBACK = [255, 255, 255];
    let probe = null;
    const toRGB = (color, fallback) => {
      if (!probe) {
        const c = document.createElement("canvas");
        c.width = c.height = 1;
        probe = c.getContext("2d", { willReadFrequently: true });
      }
      if (!probe) return fallback;
      probe.clearRect(0, 0, 1, 1);
      probe.fillStyle = "rgba(0,0,0,0)";
      probe.fillStyle = color;
      probe.fillRect(0, 0, 1, 1);
      const d = probe.getImageData(0, 0, 1, 1).data;
      if (d[3] < 8) return fallback;
      return [d[0], d[1], d[2]];
    };

    const rgbString = (r, g, b) => "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";

    const pointInQuad = (p, o, x, y) => {
      let sign = 0;
      for (let k = 0; k < 4; k++) {
        const ax = p[o + k * 2];
        const ay = p[o + k * 2 + 1];
        const bx = p[o + ((k + 1) % 4) * 2];
        const by = p[o + ((k + 1) % 4) * 2 + 1];
        const cross = (bx - ax) * (y - ay) - (by - ay) * (x - ax);
        if (Math.abs(cross) < 1e-9) continue;
        const s = cross > 0 ? 1 : -1;
        if (sign === 0) sign = s;
        else if (s !== sign) return false;
      }
      return sign !== 0;
    };

    const quadPath = (ctx, p, o, r) => {
      if (r < 0.3) {
        ctx.moveTo(p[o], p[o + 1]);
        ctx.lineTo(p[o + 2], p[o + 3]);
        ctx.lineTo(p[o + 4], p[o + 5]);
        ctx.lineTo(p[o + 6], p[o + 7]);
        ctx.closePath();
        return;
      }
      ctx.moveTo((p[o + 6] + p[o]) / 2, (p[o + 7] + p[o + 1]) / 2);
      for (let k = 0; k < 4; k++) {
        const b = (k + 1) % 4;
        ctx.arcTo(p[o + k * 2], p[o + k * 2 + 1], p[o + b * 2], p[o + b * 2 + 1], r);
      }
      ctx.closePath();
    };

    const GridIcon = () => (
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" style={{ maxWidth: "none" }}>
        <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1" fill="currentColor" />
        <rect x="9" y="1.5" width="5.5" height="5.5" rx="1" fill="currentColor" />
        <rect x="1.5" y="9" width="5.5" height="5.5" rx="1" fill="currentColor" />
        <rect x="9" y="9" width="5.5" height="5.5" rx="1" fill="currentColor" />
      </svg>
    );

    const CubeIcon = () => (
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" style={{ maxWidth: "none" }}>
        <path d="M8 1.2 14.2 4.6v6.8L8 14.8 1.8 11.4V4.6Z" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" />
        <path d="M1.8 4.6 8 8l6.2-3.4M8 8v6.8" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" />
      </svg>
    );

    const MUTED = "var(--color-muted-foreground, #737373)";

    function Stat({ label, value, unit, sub, accent, size, align }) {
      if (align === "stack") {
        return (
          <div className="min-w-0">
            <div className="text-[13px] leading-tight" style={{ color: MUTED }}>{label}</div>
            <div className="mt-1 flex items-baseline gap-1.5">
              <span className="font-semibold tabular-nums transition-colors duration-500" style={{ color: accent, fontSize: size, lineHeight: 1, letterSpacing: "-0.02em" }}>
                {value}
              </span>
              <span className="text-[14px]">{unit}</span>
            </div>
            <div className="mt-0.5 truncate text-[12px]" style={{ color: MUTED }}>{sub}</div>
          </div>
        );
      }
      return (
        <div className="grid grid-cols-[auto_auto] items-end gap-x-2" style={{ justifyContent: align }}>
          {align === "end" ? (
            <>
              <div className="text-right text-[13px] leading-tight" style={{ color: MUTED }}>{label}</div>
              <div />
            </>
          ) : (
            <div className="col-span-2 text-[13px] leading-tight" style={{ color: MUTED }}>{label}</div>
          )}
          <div className="text-right font-semibold tabular-nums transition-colors duration-500" style={{ color: accent, fontSize: size, lineHeight: 0.95, letterSpacing: "-0.02em" }}>
            {value}
          </div>
          <div className="pb-[0.15em] leading-tight">
            <div className="text-[15px]">{unit}</div>
            <div className="whitespace-nowrap text-[13px]" style={{ color: MUTED }}>{sub}</div>
          </div>
        </div>
      );
    }

    function ContributionSkyline({
      data,
      endDate,
      view: viewProp,
      defaultView = "3d",
      onViewChange,
      palette = "github",
      title,
      unit = "contribution",
      unitPlural,
      heightScale = 1,
      duration = 1300,
      weekStart = 0,
      orbit = true,
      showStats = true,
      showLegend = true,
      showToggle = true,
      footer,
      locale = "en-US",
      seed = 7,
      onCellClick,
      className = "",
    }) {
      const endKey = endDate == null ? null : dayMs(endDate);
      const model = useMemo(() => {
        const dates = (data ?? []).map((d) => dayMs(d.date)).filter(Number.isFinite);
        const end = endKey ?? (dates.length ? Math.max(...dates) : dayMs(new Date()));
        const days = data ?? generateContributions(end, seed);
        const grid = buildGrid(days, end, weekStart);
        return { ...grid, stats: computeStats(grid.cells), months: monthLabels(grid.cells, grid.weeks, locale) };
      }, [data, endKey, seed, weekStart, locale]);

      const [innerView, setInnerView] = useState(defaultView);
      const view = viewProp ?? innerView;
      const setView = (v) => {
        if (viewProp === undefined) setInnerView(v);
        onViewChange?.(v);
      };

      const [theme, setTheme] = useState(() => {
        const p = resolvePalette(palette, false);
        return { dark: false, swatches: ["#ebedf0", ...p], accent: p[3] };
      });
      const [width, setWidth] = useState(0);
      const [active, setActive] = useState(-1);
      const [legendLevel, setLegendLevel] = useState(-1);
      const [announce, setAnnounce] = useState("");

      const rootRef = useRef(null);
      const stageRef = useRef(null);
      const canvasRef = useRef(null);
      const tipRef = useRef(null);
      const engine = useRef(null);

      const plural = unitPlural ?? unit + "s";
      const nf = useMemo(() => new Intl.NumberFormat(locale), [locale]);
      const df = useMemo(() => new Intl.DateTimeFormat(locale, { month: "short", day: "numeric", timeZone: "UTC" }), [locale]);
      const dfy = useMemo(() => new Intl.DateTimeFormat(locale, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }), [locale]);
      const dfl = useMemo(() => new Intl.DateTimeFormat(locale, { weekday: "long", month: "long", day: "numeric", year: "numeric", timeZone: "UTC" }), [locale]);
      const noun = (n) => (n === 1 ? unit : plural);
      const describe = (i) => {
        const c = model.cells[i];
        if (!c) return "";
        return (c.count ? nf.format(c.count) + " " + noun(c.count) : "No " + plural) + " on " + dfl.format(dayMs(c.date));
      };

      const cfg = useRef({ model, duration, heightScale, orbit, palette, legendLevel, onCellClick, target: view === "3d" ? 1 : 0, setActive, setWidth, setTheme, setAnnounce, describe });
      cfg.current = { model, duration, heightScale, orbit, palette, legendLevel, onCellClick, target: view === "3d" ? 1 : 0, setActive, setWidth, setTheme, setAnnounce, describe };

      useEffect(() => {
        const root = rootRef.current;
        const stage = stageRef.current;
        const canvas = canvasRef.current;
        const tip = tipRef.current;
        if (!root || !stage || !canvas || !tip) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let t = 0, target = 0, entered = false;
        let yaw = 0, elev = 0, yawGoal = 0, elevGoal = 0;
        let W = 0, H2 = 0, H3 = 0, Hmax = 0, lastH = -1, dpr = 1, gutter = 30, labelW = 30, font = "10px sans-serif";
        const col = new Float32Array(15);
        const colGoal = new Float32Array(15);
        let colReady = false, fg = FG_FALLBACK, bg = BG_FALLBACK, isDark = false;
        let n = 0, weeks = 0, wk = new Float32Array(0), dy = new Float32Array(0), lv = new Uint8Array(0), hgt = new Float32Array(0), zs = new Float32Array(0), hover = new Float32Array(0), dim = new Float32Array(0), polys = new Float32Array(0), faces = new Uint8Array(0);
        let order = [], months = [], weekdayRows = [];
        let hovered = -1, pinned = -1, activeIdx = -1, tipW = 0, raf = 0, last = 0;

        const load = () => {
          const m = cfg.current.model;
          n = m.cells.length;
          weeks = m.weeks;
          if (wk.length !== n) {
            wk = new Float32Array(n); dy = new Float32Array(n); lv = new Uint8Array(n); hgt = new Float32Array(n); zs = new Float32Array(n); hover = new Float32Array(n); dim = new Float32Array(n); polys = new Float32Array(n * 24); faces = new Uint8Array(n);
            order = Array.from({ length: n }, (_, i) => i);
          }
          for (let i = 0; i < n; i++) {
            const c = m.cells[i];
            wk[i] = c.week; dy[i] = c.day; lv[i] = c.level; hgt[i] = barHeight(c.count, m.max, cfg.current.heightScale);
          }
          months = m.months;
          const wf = new Intl.DateTimeFormat(locale, { weekday: "short", timeZone: "UTC" });
          weekdayRows = [];
          for (let d = 0; d < 7 && d < n; d++) {
            const dow = new Date(dayMs(m.cells[d].date)).getUTCDay();
            if (dow === 1 || dow === 3 || dow === 5) weekdayRows.push({ day: d, label: wf.format(dayMs(m.cells[d].date)) });
          }
        };

        const retheme = () => {
          const cs = getComputedStyle(root);
          fg = toRGB(cs.color, FG_FALLBACK) ?? FG_FALLBACK;
          const b = toRGB(cs.backgroundColor, null);
          bg = b ?? (luminance(fg) > 0.5 ? [10, 10, 10] : BG_FALLBACK);
          isDark = luminance(bg) < 0.45;
          font = "400 10px " + (cs.fontFamily || "sans-serif");
          const pal = resolvePalette(cfg.current.palette, isDark);
          const empty = mixRGB(bg, fg, isDark ? 0.11 : 0.075);
          const all = [empty, ...pal.map((c) => toRGB(c, FG_FALLBACK) ?? FG_FALLBACK)];
          for (let k = 0; k < 5; k++) for (let ch = 0; ch < 3; ch++) colGoal[k * 3 + ch] = all[k][ch];
          if (!colReady || reduced) { col.set(colGoal); colReady = true; }
          ctx.font = font;
          labelW = Math.ceil(Math.max(20, ...weekdayRows.map((r) => ctx.measureText(r.label).width))) + 8;
          const sw = all.map((c) => rgbString(c[0], c[1], c[2]));
          cfg.current.setTheme((prev) => prev.dark === isDark && prev.swatches.join() === sw.join() ? prev : { dark: isDark, swatches: sw, accent: sw[4] });
          kick();
        };

        const extent = (cam, e, full) => {
          const w = lerp(0.78, 0.9, e);
          const off = (1 - w) / 2;
          let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
          const add = (x, y, z) => {
            const p = project(cam, x, y, z);
            if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
            if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
          };
          for (let i = 0; i < n; i++) {
            const x0 = wk[i] + off, y0 = dy[i] + off, z = full ? hgt[i] * e : zs[i];
            add(x0, y0, z); add(x0 + w, y0, z); add(x0, y0 + w, z); add(x0 + w, y0 + w, 0);
          }
          add(0, 7 + 1.5 * e, 0); add(weeks, 7 + 1.5 * e, 0);
          return { minx, maxx, miny, maxy };
        };

        const relayout = () => {
          const w = Math.round(stage.clientWidth);
          if (!w || !n) return;
          W = w;
          gutter = W < 520 ? 0 : labelW;
          dpr = Math.min(2, window.devicePixelRatio || 1);
          const b2 = extent(camera(0), 0, true);
          H2 = 20 + 4 + ((b2.maxy - b2.miny) / (b2.maxx - b2.minx)) * (W - gutter - 4);
          const b3 = extent(camera(1), 1, true);
          const natural = ((b3.maxy - b3.miny) / (b3.maxx - b3.minx)) * (W - 40) + 40;
          H3 = Math.max(Math.min(natural, W * 0.72, 620), Math.min(natural, 240));
          Hmax = Math.ceil(Math.max(H2, H3));
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(Hmax * dpr);
          canvas.style.width = W + "px";
          canvas.style.height = Hmax + "px";
          lastH = -1;
          cfg.current.setWidth(W);
          draw();
        };

        const draw = () => {
          if (!W || !n) return;
          const e = easeInOutCubic(t);
          const cam = camera(e, yaw, elev);
          const Hc = lerp(H2, H3, e);
          if (Math.abs(Hc - lastH) > 0.2) { stage.style.height = Hc.toFixed(1) + "px"; lastH = Hc; }
          for (let i = 0; i < n; i++) zs[i] = riseAt(t, wk[i], weeks, dy[i]) * hgt[i];
          const b = extent(cam, e, false);
          const pad = lerp(2, 20, e);
          const left = pad + gutter * (1 - e);
          const top = pad + 20 * (1 - e);
          const aw = W - left - pad, ah = Hc - top - pad;
          const bw = Math.max(1e-6, b.maxx - b.minx), bh = Math.max(1e-6, b.maxy - b.miny);
          const s = Math.min(aw / bw, ah / bh);
          const ox = left + (aw - bw * s) / 2 - b.minx * s;
          const oy = top + (ah - bh * s) / 2 - b.miny * s;
          const { cs, sn, se, ce } = cam;
          const px = (x, y) => ox + (x * cs - y * sn) * s;
          const py = (x, y, z) => oy + ((x * sn + y * cs) * se - z * ce) * s;

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, Hmax);
          order.sort((a, c) => (wk[a] + 0.5) * sn + (dy[a] + 0.5) * cs - ((wk[c] + 0.5) * sn + (dy[c] + 0.5) * cs));

          const w = lerp(0.78, 0.9, e);
          const off = (1 - w) / 2;
          const radius = lerp(0.17, 0.03, e) * s;
          const outline = (1 - e) * 0.07;
          const lift = 0.7 * e;
          const ex = col[0], ey = col[1], ez = col[2];

          for (let k = 0; k < n; k++) {
            const i = order[k];
            const x0 = wk[i] + off, y0 = dy[i] + off, x1 = x0 + w, y1 = y0 + w;
            const z = zs[i] + hover[i] * lift;
            const o = i * 24;
            polys[o] = px(x0, y0); polys[o + 1] = py(x0, y0, z);
            polys[o + 2] = px(x1, y0); polys[o + 3] = py(x1, y0, z);
            polys[o + 4] = px(x1, y1); polys[o + 5] = py(x1, y1, z);
            polys[o + 6] = px(x0, y1); polys[o + 7] = py(x0, y1, z);
            polys[o + 8] = px(x0, y1); polys[o + 9] = py(x0, y1, 0);
            polys[o + 10] = px(x1, y1); polys[o + 11] = py(x1, y1, 0);
            polys[o + 12] = polys[o + 4]; polys[o + 13] = polys[o + 5];
            polys[o + 14] = polys[o + 6]; polys[o + 15] = polys[o + 7];
            polys[o + 16] = px(x1, y0); polys[o + 17] = py(x1, y0, 0);
            polys[o + 18] = polys[o + 10]; polys[o + 19] = polys[o + 11];
            polys[o + 20] = polys[o + 4]; polys[o + 21] = polys[o + 5];
            polys[o + 22] = polys[o + 2]; polys[o + 23] = polys[o + 3];

            const tall = z * ce * s;
            let f = 0;
            if (tall > 0.35 && w * cs * s > 0.35) f |= 1;
            if (tall > 0.35 && w * sn * s > 0.35) f |= 2;
            faces[i] = f;

            const L = lv[i] * 3;
            let r = col[L], g = col[L + 1], bl = col[L + 2];
            const d = dim[i];
            if (d > 0.002) { r += (ex - r) * 0.72 * d; g += (ey - g) * 0.72 * d; bl += (ez - bl) * 0.72 * d; }
            const hv = hover[i];
            if (hv > 0.002) { const m = 0.16 * hv; r += (fg[0] - r) * m; g += (fg[1] - g) * m; bl += (fg[2] - bl) * m; }

            if (f & 1) { ctx.beginPath(); quadPath(ctx, polys, o + 8, 0); ctx.fillStyle = rgbString(r * 0.84, g * 0.84, bl * 0.84); ctx.fill(); }
            if (f & 2) { ctx.beginPath(); quadPath(ctx, polys, o + 16, 0); ctx.fillStyle = rgbString(r * 0.68, g * 0.68, bl * 0.68); ctx.fill(); }
            ctx.beginPath(); quadPath(ctx, polys, o, radius); ctx.fillStyle = rgbString(r, g, bl); ctx.fill();
            if (outline > 0.004) { ctx.strokeStyle = `rgba(${fg[0]},${fg[1]},${fg[2]},${outline.toFixed(3)})`; ctx.lineWidth = 1; ctx.stroke(); }
            if (hv > 0.02) { ctx.strokeStyle = `rgba(${fg[0]},${fg[1]},${fg[2]},${(0.85 * hv).toFixed(3)})`; ctx.lineWidth = 1.5; ctx.stroke(); }
          }

          const muted = mixRGB(bg, fg, 0.55);
          ctx.font = font;
          const a2 = 1 - smoothstep(0, 0.4, e);
          const a3 = smoothstep(0.62, 1, e);
          if (a2 > 0.004) {
            ctx.fillStyle = `rgba(${Math.round(muted[0])},${Math.round(muted[1])},${Math.round(muted[2])},${a2.toFixed(3)})`;
            ctx.textAlign = "left"; ctx.textBaseline = "bottom";
            let edge = -Infinity;
            for (const m of months) {
              const x = px(m.week + off, -0.3); const tw = ctx.measureText(m.label).width;
              if (x < edge || x + tw > W) continue;
              ctx.fillText(m.label, x, py(m.week + off, -0.3, 0) - 3);
              edge = x + tw + 6;
            }
            ctx.textAlign = "right"; ctx.textBaseline = "middle";
            if (gutter > 0) for (const r of weekdayRows) ctx.fillText(r.label, px(0, r.day + 0.5) - 6, py(0, r.day + 0.5, 0));
          }
          if (a3 > 0.004) {
            ctx.fillStyle = `rgba(${Math.round(muted[0])},${Math.round(muted[1])},${Math.round(muted[2])},${a3.toFixed(3)})`;
            ctx.textAlign = "left"; ctx.textBaseline = "top";
            let edge = -Infinity;
            for (const m of months) {
              const x = px(m.week + 0.5, 7.3);
              if (x < edge || x + ctx.measureText(m.label).width > W) continue;
              ctx.fillText(m.label, x, py(m.week + 0.5, 7.3, 0) + 2);
              edge = x + ctx.measureText(m.label).width + 10;
            }
          }

          if (activeIdx >= 0 && activeIdx < n) {
            const i = activeIdx;
            const z = zs[i] + hover[i] * lift;
            const tx = px(wk[i] + 0.5, dy[i] + 0.5);
            const ty = Math.min(py(wk[i] + off, dy[i] + off, z), py(wk[i] + off + w, dy[i] + off, z), py(wk[i] + off, dy[i] + off + w, z));
            const half = tipW / 2;
            const cx = Math.min(W - half - 2, Math.max(half + 2, tx));
            tip.style.transform = `translate(${(cx - half).toFixed(1)}px,${(ty - 8).toFixed(1)}px) translateY(-100%)`;
            tip.style.setProperty("--arrow", (tx - cx + half).toFixed(1) + "px");
          }
        };

        const tick = (now) => {
          raf = 0;
          const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
          last = now;
          let moving = false;
          if (t !== target) {
            const step = reduced ? 1 : (dt * 1000) / Math.max(1, cfg.current.duration);
            t = target > t ? Math.min(target, t + step) : Math.max(target, t - step);
            moving = true;
          }
          const ko = reduced ? 1 : 1 - Math.exp(-dt * 12);
          yaw += (yawGoal - yaw) * ko; elev += (elevGoal - elev) * ko;
          if (Math.abs(yawGoal - yaw) > 1e-4 || Math.abs(elevGoal - elev) > 1e-4) moving = true;
          else { yaw = yawGoal; elev = elevGoal; }

          const kc = reduced ? 1 : 1 - Math.exp(-dt * 7);
          for (let k = 0; k < 15; k++) {
            const d = colGoal[k] - col[k];
            if (Math.abs(d) > 0.4) { col[k] += d * kc; moving = true; } else col[k] = colGoal[k];
          }

          const kh = reduced ? 1 : 1 - Math.exp(-dt * 16);
          const kd = reduced ? 1 : 1 - Math.exp(-dt * 10);
          const leg = cfg.current.legendLevel;
          for (let i = 0; i < n; i++) {
            const hg = i === activeIdx ? 1 : 0;
            const dg = leg >= 0 && lv[i] !== leg ? 1 : 0;
            if (hover[i] !== hg) { hover[i] += (hg - hover[i]) * kh; moving = true; }
            if (dim[i] !== dg) { dim[i] += (dg - dim[i]) * kd; moving = true; }
          }

          draw();
          if (moving) raf = requestAnimationFrame(tick);
        };

        const kick = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };
        const refreshActive = () => {
          const next = hovered >= 0 ? hovered : pinned;
          if (next === activeIdx) return;
          activeIdx = next;
          cfg.current.setActive(next);
          kick();
        };

        const hit = (x, y) => {
          for (let k = n - 1; k >= 0; k--) {
            const i = order[k], o = i * 24;
            if (pointInQuad(polys, o, x, y)) return i;
            if (faces[i] & 1 && pointInQuad(polys, o + 8, x, y)) return i;
            if (faces[i] & 2 && pointInQuad(polys, o + 16, x, y)) return i;
          }
          return -1;
        };

        let drag = null;
        const local = (ev) => {
          const r = canvas.getBoundingClientRect();
          return [ev.clientX - r.left, ev.clientY - r.top];
        };

        const onDown = (ev) => {
          if (ev.button !== 0) return;
          const can = cfg.current.orbit && target === 1;
          drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, yaw: yawGoal, elev: elevGoal, moved: false, orbit: can, mouse: ev.pointerType === "mouse" };
        };

        const onMove = (ev) => {
          if (drag && drag.orbit && ev.pointerId === drag.id) {
            const dx = ev.clientX - drag.x, dyy = ev.clientY - drag.y;
            if (drag.moved || Math.hypot(dx, dyy) > 4) {
              drag.moved = true;
              yawGoal = Math.min(YAW_RANGE[1] - YAW_3D, Math.max(YAW_RANGE[0] - YAW_3D, drag.yaw + dx * 0.006));
              if (drag.mouse) elevGoal = Math.min(ELEV_RANGE[1] - ELEV_3D, Math.max(ELEV_RANGE[0] - ELEV_3D, drag.elev + dyy * 0.004));
              canvas.style.cursor = "grabbing";
              hovered = -1;
              refreshActive();
              kick();
              return;
            }
          }
          if (ev.pointerType !== "mouse") return;
          const [x, y] = local(ev);
          const i = hit(x, y);
          if (i !== hovered) { hovered = i; refreshActive(); }
          canvas.style.cursor = cfg.current.orbit && target === 1 ? "grab" : i >= 0 ? "pointer" : "default";
        };

        const onUp = (ev) => {
          if (!drag || ev.pointerId !== drag.id) return;
          const wasMoved = drag.moved;
          drag = null;
          canvas.style.cursor = cfg.current.orbit && target === 1 ? "grab" : "default";
          if (wasMoved) return;
          const [x, y] = local(ev);
          const i = hit(x, y);
          pinned = i === pinned ? -1 : i;
          refreshActive();
        };

        const setTarget = () => {
          const goal = cfg.current.target;
          target = goal;
          if (goal === 0) { yawGoal = 0; elevGoal = 0; }
          canvas.style.cursor = cfg.current.orbit && target === 1 ? "grab" : "default";
          kick();
        };

        load(); retheme(); relayout();
        
        // Start from flat 2D (t=0) and animate up into 3D skyline (t=1)
        t = 0;
        target = 0;
        setTimeout(() => {
          entered = true;
          setTarget();
        }, 300);

        const ro = new ResizeObserver(() => relayout());
        ro.observe(stage);

        canvas.addEventListener("pointerdown", onDown);
        canvas.addEventListener("pointermove", onMove);
        canvas.addEventListener("pointerup", onUp);
        canvas.addEventListener("pointerleave", () => { if (!drag) { hovered = -1; refreshActive(); } });
        canvas.addEventListener("dblclick", () => { yawGoal = 0; elevGoal = 0; kick(); });

        engine.current = {
          kick: () => { setTarget(); kick(); },
          load: () => { load(); retheme(); relayout(); },
          retheme,
          tipWidth: (w) => { tipW = w; draw(); },
        };

        return () => {
          if (raf) cancelAnimationFrame(raf)
          ro.disconnect();
          engine.current = null;
        };
      }, [locale]);

      useEffect(() => { engine.current?.kick(); }, [view, legendLevel]);
      useEffect(() => { engine.current?.load(); }, [model, heightScale]);
      useEffect(() => { engine.current?.retheme(); }, [palette]);

      useLayoutEffect(() => {
        const tip = tipRef.current;
        if (tip && active >= 0) engine.current?.tipWidth(tip.offsetWidth);
      }, [active, model]);

      const { stats } = model;
      const range = (a, b) => (!a || !b ? "—" : df.format(dayMs(a)) + " — " + df.format(dayMs(b)));
      const is3d = view === "3d";
      const corners = showStats && width >= 560;
      const bigSize = Math.round(Math.max(30, Math.min(56, width * 0.058)));
      const statBlocks = [
        { label: "1 year total", value: nf.format(stats.total), unit: noun(stats.total), sub: range(stats.first, stats.last) },
        { label: "Busiest day", value: nf.format(stats.busiest.count), unit: noun(stats.busiest.count), sub: stats.busiest.date ? df.format(dayMs(stats.busiest.date)) : "—" },
        { label: "Longest streak", value: nf.format(stats.longest.days), unit: stats.longest.days === 1 ? "day" : "days", sub: range(stats.longest.start, stats.longest.end) },
        { label: "Current streak", value: nf.format(stats.current.days), unit: stats.current.days === 1 ? "day" : "days", sub: range(stats.current.start, stats.current.end) },
      ];
      const showRow = showStats && !(is3d && corners);
      const levelNames = ["No " + plural, "Light", "Moderate", "Heavy", "Heaviest"];
      const hints = ["Hover a day for details · arrow keys to explore", "Drag to orbit · double-click to reset view"];
      const hint = hints[is3d && orbit ? 1 : 0];

      return (
        <section
          ref={rootRef}
          className={"relative w-full rounded-xl border p-4 font-sans sm:p-5 shadow-lg " + className}
          style={{
            background: "var(--color-background, #ffffff)",
            color: "var(--color-foreground, #171717)",
            borderColor: "var(--color-border, #e5e5e5)",
          }}
        >
          <header className="mb-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
            <h3 className="m-0 text-[15px] font-normal leading-snug">
              {title ?? (
                <>
                  <span className="font-semibold tabular-nums">{nf.format(stats.total)}</span> {noun(stats.total)} in the last year
                </>
              )}
            </h3>
            {showToggle && (
              <div
                role="group"
                aria-label="Chart view"
                className="relative inline-flex rounded-lg border p-1 bg-zinc-100 dark:bg-zinc-800"
                style={{ borderColor: "var(--color-border, #e5e5e5)" }}
              >
                <button
                  type="button"
                  onClick={() => setView("2d")}
                  className={`flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md transition-all ${
                    view === "2d"
                      ? "bg-white dark:bg-zinc-900 text-foreground shadow-sm font-bold"
                      : "text-zinc-500 hover:text-foreground"
                  }`}
                >
                  <GridIcon />
                  <span>2D View</span>
                </button>
                <button
                  type="button"
                  onClick={() => setView("3d")}
                  className={`flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md transition-all ${
                    view === "3d"
                      ? "bg-white dark:bg-zinc-900 text-foreground shadow-sm font-bold"
                      : "text-zinc-500 hover:text-foreground"
                  }`}
                >
                  <CubeIcon />
                  <span>3D Skyline</span>
                </button>
              </div>
            )}
          </header>

          <div className="relative rounded-lg border" style={{ borderColor: "var(--color-border, #e5e5e5)" }}>
            <div className="relative px-3 pt-3 sm:px-4 sm:pt-4">
              <div
                ref={stageRef}
                className="relative w-full overflow-hidden rounded-md"
                style={{ height: 160 }}
              >
                <canvas
                  ref={canvasRef}
                  tabIndex={0}
                  className="absolute top-0 left-0 block outline-none"
                  style={{ maxWidth: "none" }}
                />

                {showStats && corners && (
                  <>
                    <div
                      aria-hidden={!is3d}
                      className="pointer-events-none absolute top-1 right-1 flex flex-col items-end gap-5 transition-opacity duration-500"
                      style={{ opacity: is3d ? 1 : 0 }}
                    >
                      <Stat {...statBlocks[0]} accent={theme.accent} size={bigSize} align="end" />
                      <Stat {...statBlocks[1]} accent={theme.accent} size={bigSize} align="end" />
                    </div>
                    <div
                      aria-hidden={!is3d}
                      className="pointer-events-none absolute bottom-1 left-1 flex flex-col items-start gap-5 transition-opacity duration-500"
                      style={{ opacity: is3d ? 1 : 0 }}
                    >
                      <Stat {...statBlocks[2]} accent={theme.accent} size={bigSize} align="start" />
                      <Stat {...statBlocks[3]} accent={theme.accent} size={bigSize} align="start" />
                    </div>
                  </>
                )}
              </div>

              <div
                ref={tipRef}
                role="tooltip"
                className="pointer-events-none absolute top-3 left-3 z-20 whitespace-nowrap rounded-md px-2.5 py-1.5 text-[12px] leading-none shadow-lg transition-opacity duration-150"
                style={{
                  opacity: active >= 0 ? 1 : 0,
                  background: "var(--color-foreground, #171717)",
                  color: "var(--color-background, #ffffff)",
                }}
              >
                {active >= 0 && model.cells[active] ? (
                  <>
                    <strong className="font-semibold">
                      {model.cells[active].count ? nf.format(model.cells[active].count) + " " + noun(model.cells[active].count) : "No " + plural}
                    </strong>
                    <span className="opacity-75"> on {dfy.format(dayMs(model.cells[active].date))}</span>
                  </>
                ) : (" ")}
              </div>
            </div>

            {showStats && (
              <div
                aria-hidden={!showRow}
                className="grid transition-all"
                style={{
                  gridTemplateRows: showRow ? "1fr" : "0fr",
                  opacity: showRow ? 1 : 0,
                  transitionDuration: duration + "ms",
                }}
              >
                <div className="min-h-0 overflow-hidden">
                  <div className="grid grid-cols-2 gap-x-4 gap-y-4 px-3 pt-4 pb-1 sm:px-4 md:grid-cols-4">
                    {statBlocks.map((b) => (
                      <Stat key={b.label} {...b} accent={theme.accent} size={28} align="stack" />
                    ))}
                  </div>
                </div>
              </div>
            )}

            <div className="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 px-3 pt-3 pb-3 text-[12px] sm:px-4 border-t" style={{ color: MUTED, borderColor: "var(--color-border, #e5e5e5)" }}>
              <span>{hint}</span>
              {showLegend && (
                <div className="flex items-center gap-1.5" onMouseLeave={() => setLegendLevel(-1)}>
                  <span className="mr-0.5">Less</span>
                  {theme.swatches.map((c, i) => (
                    <button
                      key={i}
                      type="button"
                      title={levelNames[i]}
                      onMouseEnter={() => setLegendLevel(i)}
                      onClick={() => setLegendLevel((l) => (l === i ? -1 : i))}
                      className="h-[11px] w-[11px] cursor-pointer rounded-[2px] border-0 p-0 transition-transform duration-500 hover:scale-125"
                      style={{ background: c }}
                    />
                  ))}
                  <span className="ml-0.5">More</span>
                </div>
              )}
            </div>
          </div>
        </section>
      );
    }

    // Interactive Demo
    function Demo() {
      const [view, setView] = useState("3d");
      const [animKey, setAnimKey] = useState(0);

      const replayWave = () => {
        setAnimKey(k => k + 1);
      };

      return (
        <div className="w-full bg-background px-4 py-8 sm:px-8">
          <div className="mx-auto w-full max-w-[980px]">
            {/* Quick Animation Controls */}
            <div className="mb-4 flex flex-wrap items-center justify-between gap-2 p-2 rounded-lg bg-zinc-100 dark:bg-zinc-800/80 border border-zinc-200 dark:border-zinc-700">
              <span className="text-xs text-zinc-600 dark:text-zinc-300 font-medium">
                ⚡ <b>Animation Controls:</b> "2D View" এ ক্লিক করলে ফ্ল্যাট হবে, "3D Skyline" এ ক্লিক করলে ওয়েভ উঠবে।
              </span>
              <button
                onClick={replayWave}
                className="px-3 py-1.5 text-xs font-semibold rounded bg-emerald-600 hover:bg-emerald-500 text-white shadow transition cursor-pointer"
              >
                ▶️ Replay 3D Wave Animation
              </button>
            </div>

            <ContributionSkyline
              key={animKey}
              view={view}
              onViewChange={setView}
              endDate="2017-11-08"
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
